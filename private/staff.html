<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff — Travia Cafe</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=4">
  <script src="/common.js?v=3" defer></script>
  <script src="/fx.js?v=3" defer></script>
  <script src="{{STAFF_PATH}}/staff.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap row">
      <span class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 2.8v5.6c0 4.9-3.2 9.2-7.5 10.8-4.3-1.6-7.5-5.9-7.5-10.8V5.3L12 2.5z"/><path d="M8.8 12l2.3 2.3 4.4-4.5"/></svg></span>Staff area</span>
      <div class="nav-actions" id="who" hidden>
        <span class="who hide-sm" id="whoName"></span>
        <button class="btn small ghost" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="loginView" class="panel" style="max-width:420px; margin:72px auto" hidden>
      <h2>Staff login</h2>
      <form id="loginForm" novalidate>
        <label>Email <input name="email" type="email" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Log in</button>
      </form>
      <div id="loginMsg"></div>
    </section>

    <section id="appView" hidden>
      <div id="mailWarn"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="flash"></div>
      <div id="view" class="stack"></div>
    </section>
  </main>
</body>
</html>
