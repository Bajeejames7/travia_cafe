# Render Blueprint: New > Blueprint > pick this repo. Everything here runs on free plans:
#   website: Render free · database: Aiven free PostgreSQL · videos: Backblaze B2 free 10 GB · email: Brevo free.
# Render's free plan has no persistent disk and blocks SMTP email, which is why videos go to Backblaze
# and email goes through Brevo's web API. Blank values can be filled in later under the service's Environment tab.
services:
  - type: web
    name: travia-cafe
    runtime: node
    region: frankfurt        # closest Render region to Kenya; create the Aiven database in Frankfurt too
    plan: free               # sleeps after 15 minutes without visitors; the next visit takes about a minute
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.0"
      - key: TRUST_PROXY
        value: "1"           # correct while the Cloudflare DNS record is "DNS only" (grey cloud); see README
      - key: STAFF_PATH
        generateValue: true  # random secret path for the staff dashboard; read it in the Render dashboard
      - key: DATABASE_URL    # Aiven service URI, e.g. postgres://avnadmin:...@...aivencloud.com:12345/defaultdb?sslmode=require
        sync: false
      - key: DATABASE_CA_CERT  # contents of Aiven's ca.pem, so the database certificate is verified
        sync: false
      - key: PUBLIC_URL      # https://traviacafe.com once the domain points here (https://travia-cafe.onrender.com until then)
        sync: false
      - key: ADMIN_EMAIL     # only used if the database has no admin yet
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: S3_ENDPOINT     # Backblaze bucket page > Endpoint, e.g. s3.eu-central-003.backblazeb2.com
        sync: false
      - key: S3_BUCKET       # the private bucket's name
        sync: false
      - key: S3_KEY_ID       # Backblaze > Application Keys > keyID
        sync: false
      - key: S3_SECRET       # Backblaze > Application Keys > applicationKey (shown once)
        sync: false
      - key: BREVO_API_KEY   # Brevo > SMTP & API > API keys
        sync: false
      - key: MAIL_FROM       # a sender verified in Brevo, e.g. Travia Cafe <hello@traviacafe.com>
        sync: false
      - key: MAIL_REPLY_TO   # where student replies go, e.g. traviacafe@gmail.com
        sync: false
      - key: PAYHERO_AUTH    # PayHero > API Keys > Basic Authorization token. Empty = M-PESA prompt off
        sync: false
      - key: PAYHERO_CHANNEL_ID  # PayHero > Payment Channels > My Payment Channels > channel ID
        sync: false
