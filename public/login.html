<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Travia Cafe</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/fx.js" defer></script>
  <script src="/login.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap row">
      <a class="brand" href="/"><span class="logo">&gt;_</span><span>Travia Cafe</span></a>
      <nav><a href="/#tracks">Ways to learn</a><a href="/#modules">Prices</a></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="panel auth-card">
      <div id="authMsg"></div>

      <div id="authMain">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-mode="login" aria-selected="true">Log in</button>
          <button type="button" role="tab" data-mode="signup" aria-selected="false">Create account</button>
        </div>

        <a class="btn google" id="googleBtn" href="/auth/google" hidden>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </a>
        <p class="divider" id="googleDivider" hidden><span>or with email</span></p>

        <form id="loginForm" novalidate>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
          <button class="btn wide" type="submit">Log in</button>
          <p class="small"><a href="#" id="forgotLink">Forgot your password?</a></p>
        </form>

        <form id="signupForm" novalidate hidden>
          <label>Full name <input name="name" autocomplete="name" maxlength="100" required></label>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
          <label>Password (8+ characters) <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <button class="btn wide" type="submit">Create account</button>
          <p class="muted small">Your codes, class links and receipts will be sent to this email.</p>
        </form>
      </div>

      <form id="forgotForm" novalidate hidden>
        <h2>Reset your password</h2>
        <p class="muted small">Enter your account email and we'll send you a reset link.</p>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <button class="btn wide" type="submit">Send reset link</button>
        <p class="small"><a href="/login">Back to log in</a></p>
      </form>

      <form id="resetForm" novalidate hidden>
        <h2>Choose a new password</h2>
        <label>New password (8+ characters) <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn wide" type="submit">Save and log in</button>
      </form>
    </div>
  </main>
</body>
</html>
